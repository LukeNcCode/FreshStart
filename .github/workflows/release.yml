name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string
      title:
        description: "Release title"
        required: false
        default: "FreshStart"
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.426

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build release assets
        shell: pwsh
        run: .\build\publish.ps1 -SkipOfflineInstaller

      - name: Verify release assets
        shell: pwsh
        run: .\build\verify-release.ps1 -SkipOfflineInstaller

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          $assets = @(
            Get-ChildItem "publish" -File |
              Where-Object { $_.Name -match '^FreshStart-v.+-setup\.exe(\.sha256)?$' } |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -eq 0) { throw "No release assets found." }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title "$env:RELEASE_TITLE" `
              --generate-notes
          }
